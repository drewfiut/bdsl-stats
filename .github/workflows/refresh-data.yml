name: Refresh BDSL data

on:
  schedule:
    # 12:00 UTC every other day (Sun, Tue, Thu, Sat)
    - cron: "0 12 * * 0,2,4,6"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-collect the live season even if today's snapshot already exists"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Refresh data
        run: python update_data.py ${{ inputs.force && '--force' || '' }}

      # Must run AFTER the collect, in the same job: the roster-vs-element comparison is only
      # meaningful next to the element snapshot it was measured against, and the web app's
      # provisional totals subtract the confirmed stats.csv figures from these roster numbers
      # (DATA.md 5.8). Kept out of collect.py itself -- that stays a pure element collect --
      # and non-fatal on purpose: it makes ~150 requests (one per club per competition), so a
      # single bdsl.org hiccup must never block committing the stats refresh that already
      # succeeded. A skipped run just leaves yesterday's rows, which the app handles.
      - name: Roster-page lag check
        continue-on-error: true
        run: python lagcheck.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh BDSL data"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger deploy.yml's push event,
  # so publish the refreshed data to Pages explicitly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      # Build the data commit we just pushed, not this run's (older) caller commit.
      ref: ${{ needs.refresh.outputs.sha }}
